auditConfig:
  # No patched release yet; drop each entry once one ships.
  ignoreGhsas:
    # node-forge <=1.4.0, through listhen in the Nuxt dev server (nuxt as a peer of
    # @vercel/analytics); no signature verification at runtime.
    - GHSA-86w9-cpqp-85rv
    # braces <=3.0.3, through micromatch in Expo's Metro file map; build-time globs only.
    - GHSA-vfj7-8cjw-p6xm
catalogMode: strict
catalogPrune: true
engineStrict: true
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  # First-party ScaleDockHQ release, adopted on publish day; remove after 2026-10-05 19:42 UTC.
  - better-supabase@0.5.1
nodeLinker: isolated
nodeOptions: "${NODE_OPTIONS:- } --disable-warning=MODULE_TYPELESS_PACKAGE_JSON"
saveExact: true
savePrefix: ""
strictDepBuilds: true
strictPeerDependencies: true
trustPolicy: no-downgrade
# Versions older than 30 days are not checked, so long-published releases never block an install.
trustPolicyIgnoreAfter: 43200
trustPolicyExclude:
  # Reaches react-native-web through fbjs; its 1.0.x releases carry weaker trust
  # evidence than an earlier release, which `no-downgrade` rejects.
  - ua-parser-js

peerDependencyRules:
  allowedVersions:
    # Only its optional Nest integration needs the peer; tests/integration runs Nest 12.
    "@supabase/server>@nestjs/common": "12"
    # typegen 0.4.0 pins oxfmt 0.66.0 exactly; better-supabase 0.5.1, its only parent, accepts >=0.66.0 <1.
    "@supabase/postgrest-typegen>oxfmt": "0.71"

# The VS Code TypeScript native preview looks for `@typescript/typescript-<platform>`
# next to `node_modules/typescript` without following pnpm's symlinks.
publicHoistPattern:
  - "@typescript/*"

packageExtensions:
  # Oxlint loads these plugins through `jsPlugins`; they import only ESLint types.
  eslint-plugin-turbo:
    peerDependenciesMeta:
      eslint:
        optional: true
  # Oxlint parses the files itself, so neither ESLint nor its TypeScript parser loads.
  "@shadcn/lint":
    peerDependenciesMeta:
      eslint:
        optional: true
      "@typescript-eslint/parser":
        optional: true

# No `typescript: 'catalog:'` override: tests/types pins TypeScript 5.9 and 6
# through `catalog:ts59` and `catalog:ts6`, and an override would force them to 7.
overrides:
  # drizzle-orm takes kysely as an optional peer; one kysely keeps one drizzle-orm variant, so its `SQL` type matches between permdock and the examples.
  kysely: "catalog:"
  # drizzle-orm also takes pg as an optional peer; @prisma/adapter-pg and @supabase/server pin an older patch.
  pg: "catalog:"
  # One React, React DOM and Next.js everywhere, so hooks and server components never see two copies.
  next: "catalog:"
  react: "catalog:"
  react-dom: "catalog:"
  # Expo SDK 57 packages ask for their own copies; one version keeps the Expo example on one Metro and worklets runtime.
  "@react-native/metro-config": "catalog:"
  react-native-worklets: "catalog:"
  # Patched releases for exact pins whose parent has no fixed stable release; drop each once the parent ships one.
  "miniflare>undici": 7.30.0
  "miniflare>sharp": 0.35.5
  "eve>undici": 8.11.2
  "openai>undici": 8.11.2
  mysql2: 3.24.5
  "@prisma/config>deepmerge-ts": 8.0.2
  # Patched releases for advisories in transitive dependencies of Nuxt, Solid, Vue, Expo, React Native, Express, shadcn and the Claude Agent SDK; drop each once its parent resolves a fixed version.
  simple-git: 4.0.1
  "@simple-git/argv-parser": 2.0.1
  seroval: 1.6.3
  proxy-addr: 2.0.8
  source-map-js: 1.2.2
  compression: 1.8.2
  shell-quote: 1.11.0
  "@modelcontextprotocol/sdk": 1.31.0

allowBuilds:
  # Engine downloads are for `prisma migrate`; tests/integration creates tables with SQL.
  "@prisma/engines": false
  prisma: false
  # testcontainers talks to Docker through dockerode, which compiles ssh2 and its cpu-features helper.
  cpu-features: true
  ssh2: true
  # dockerode's gRPC client; the postinstall only prints a notice but strictDepBuilds needs a decision.
  protobufjs: true
  # tests/runtimes: the Deno CLI and Miniflare's workerd binary.
  deno: true
  workerd: true
  # tsdown, Vite and the Expo toolchain load esbuild's platform binary.
  esbuild: true
  # Installs the git hooks from lefthook.yml.
  lefthook: true
  # The Supabase CLI binary for the next-better-supabase stack, pgTAP and declarative sync.
  supabase: true
