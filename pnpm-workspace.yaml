catalogMode: strict
catalogPrune: true
engineStrict: true
minimumReleaseAge: 1440
nodeLinker: isolated
nodeOptions: '${NODE_OPTIONS:- } --disable-warning=MODULE_TYPELESS_PACKAGE_JSON'
saveExact: true
savePrefix: ''
strictDepBuilds: true
strictPeerDependencies: true
trustPolicy: no-downgrade
# Versions older than 30 days are not checked, so long-published releases never block an install.
trustPolicyIgnoreAfter: 43200
trustPolicyExclude:
  # Reaches react-native-web through fbjs; its 1.0.x releases carry weaker trust
  # evidence than an earlier release, which `no-downgrade` rejects.
  - ua-parser-js

peerDependencyRules:
  allowedVersions:
    # Only its optional Nest integration needs the peer; tests/integration runs Nest 12.
    '@supabase/server>@nestjs/common': '12'
    # Only `svelte-kit sync` type generation reads it; the e2e fixture builds with Vite.
    '@sveltejs/kit>typescript': '7'

# The VS Code TypeScript native preview looks for `@typescript/typescript-<platform>`
# next to `node_modules/typescript` without following pnpm's symlinks.
publicHoistPattern:
  - '@typescript/*'

packageExtensions:
  # Oxlint loads these plugins through `jsPlugins`; they import only ESLint types.
  eslint-plugin-turbo:
    peerDependenciesMeta:
      eslint:
        optional: true
  eslint-plugin-playwright:
    peerDependenciesMeta:
      eslint:
        optional: true
  # Oxlint parses the files itself, so neither ESLint nor its TypeScript parser loads.
  '@shadcn/lint':
    peerDependenciesMeta:
      eslint:
        optional: true
      '@typescript-eslint/parser':
        optional: true

# No `typescript: 'catalog:'` override: tests/types pins TypeScript 5.9 and 6
# through `catalog:ts59` and `catalog:ts6`, and an override would force them to 7.
overrides:
  # One drizzle-orm peer variant everywhere, so its `SQL` type matches between permdock and the examples.
  kysely: 'catalog:'
  # One React, React DOM and Next.js everywhere, so hooks and server components never see two copies.
  next: 'catalog:'
  react: 'catalog:'
  react-dom: 'catalog:'
  # Expo SDK 57 packages ask for their own copies; one version keeps the Expo example and fixture on one Metro and worklets runtime.
  '@react-native/metro-config': 'catalog:'
  react-native-worklets: 'catalog:'

allowBuilds:
  # Engine downloads are for `prisma migrate`; tests/integration creates tables with SQL.
  '@prisma/engines': false
  prisma: false
  # testcontainers talks to Docker through dockerode, which compiles ssh2 and its cpu-features helper.
  cpu-features: true
  ssh2: true
  # dockerode's gRPC client; the postinstall only prints a notice but strictDepBuilds needs a decision.
  protobufjs: true
  # tests/runtimes: the Deno CLI and Miniflare's workerd binary.
  deno: true
  workerd: true
  # tsdown, Vite and the Expo toolchain load esbuild's platform binary.
  esbuild: true
  # Installs the git hooks from lefthook.yml.
  lefthook: true
