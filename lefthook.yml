pre-commit:
  parallel: true
  commands:
    fmt:
      glob: '*.{js,ts,tsx,mjs,cjs,json,jsonc,yml,yaml}'
      exclude: '{.agents,.cursor,.claude}/**'
      run: pnpm exec oxfmt {staged_files}
      stage_fixed: true
    lint:
      glob: '*.{js,ts,tsx,mjs,cjs}'
      exclude: '{.agents,.cursor,.claude}/**'
      run: pnpm exec oxlint --fix {staged_files}
      stage_fixed: true

commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}

pre-push:
  commands:
    check:
      run: pnpm run check
