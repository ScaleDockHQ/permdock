pre-commit:
  parallel: true
  jobs:
    - name: format
      glob: "*.{ts,tsx,mts,js,mjs,cjs,json,jsonc,md,mdx,css,yml,yaml}"
      exclude:
        - "{.agents,.cursor,.claude}/**"
        - "**/permissions.catalog.json"
      run: pnpm exec oxfmt --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
    - name: lint
      run: pnpm exec turbo run lint lint:root --affected

commit-msg:
  jobs:
    - name: commitlint
      run: pnpm exec commitlint --edit {1}

pre-push:
  jobs:
    - name: affected
      env:
        TURBO_SCM_BASE: origin/main
      run: pnpm exec turbo run lint typecheck test --affected
