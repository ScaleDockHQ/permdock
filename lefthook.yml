# Hooks call binaries from node_modules/.bin: `pnpm exec` adds 70 to 260 ms per call.
# Pre-commit formats and lints the staged files; pre-push runs the affected gate of `pnpm check:affected`.
# Tests run in CI only (docs/decisions/0049-affected-hook-gate.md, 0069-staged-lint-on-commit.md).
# Without `execution`, a job prints its output only when it fails.
output:
  - meta
  - summary
  - failure

pre-commit:
  piped: true
  skip:
    - merge
    - rebase
  jobs:
    - name: format
      glob: "*.{ts,tsx,mts,js,mjs,cjs,json,jsonc,md,mdx,css,yml,yaml}"
      exclude:
        - "{.agents,.cursor,.claude}/**"
        - "**/permissions.catalog.json"
      run: node_modules/.bin/oxfmt --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
    - name: lint
      glob: "*.{ts,tsx,mts,cts,js,jsx,mjs,cjs}"
      run: node scripts/lint-staged.ts {staged_files}

commit-msg:
  jobs:
    - name: commitlint
      run: node_modules/.bin/commitlint --edit {1}

pre-push:
  jobs:
    - name: affected
      env:
        TURBO_SCM_BASE: origin/main
      run: env -u TURBO_CACHE_DIR node_modules/.bin/turbo run lint:root lint typecheck --affected --cache=local:rw,remote:r --output-logs=errors-only --continue=dependencies-successful
