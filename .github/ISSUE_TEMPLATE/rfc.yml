name: RFC
description: Propose a public API, wire-format, or CLI change
title: 'rfc: '
labels: ['rfc']
body:
  - type: markdown
    attributes:
      value: Public identifier, wire format, and CLI flag changes start here. Accepted RFCs update the owning concept page under apps/docs/content/docs.
  - type: textarea
    id: context
    attributes:
      label: Context
      description: What problem does this solve, and who hits it.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The API or format change. Name identifiers exactly.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: What else was considered and why it lost.
    validations:
      required: true
  - type: textarea
    id: migration
    attributes:
      label: Impact
      description: What changes for callers, and which docs pages, fixtures and adapters must be updated.
    validations:
      required: true
