name: Bug
description: Report a defect in PermDock
title: 'bug: '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: Search existing issues first. Security reports go to SECURITY.md, not here.
  - type: textarea
    id: expected
    attributes:
      label: Expected
      description: What should happen.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual
      description: What happens instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Minimal steps or a code sample.
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js
      placeholder: '24.20.0'
    validations:
      required: true
  - type: input
    id: pnpm
    attributes:
      label: pnpm
      placeholder: '12.6.0'
    validations:
      required: true
  - type: input
    id: typescript
    attributes:
      label: TypeScript
      placeholder: '7.0.2'
    validations:
      required: true
  - type: input
    id: adapter
    attributes:
      label: Adapter or import path
      description: For example permdock/react or permdock/hono. Leave blank if core.
      placeholder: permdock/next
