version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    # An Expo SDK upgrade moves these together; `expo` pins its SDK's React Native minor.
    ignore:
      - dependency-name: 'expo'
        update-types: ['version-update:semver-major']
      - dependency-name: 'expo-*'
        update-types: ['version-update:semver-major']
      - dependency-name: '@expo/*'
        update-types: ['version-update:semver-major']
      - dependency-name: 'babel-preset-expo'
        update-types: ['version-update:semver-major']
      - dependency-name: 'react-native'
        update-types: ['version-update:semver-minor']
    groups:
      oxc:
        patterns:
          - oxlint
          - oxfmt
          - oxlint-tsgolint
      turbo:
        patterns:
          - turbo
          - '@turbo/*'
      commitlint:
        patterns:
          - '@commitlint/*'
      dependencies:
        patterns:
          - '*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - '*'
