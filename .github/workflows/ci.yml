name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Nightly flake hunt: every e2e test three times, no retries.
    - cron: '17 3 * * *'

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Turborepo remote cache on the Vercel team. Unset (forks, before setup) means local cache only.
env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}

jobs:
  check:
    name: Check and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          runtime: node@24
          cache: true
          require-lockfile: true

      # Type-aware lint resolves workspace packages through their dist/ declarations.
      - name: Build
        run: pnpm run build

      - name: Format
        run: pnpm run fmt:check

      - name: Lint
        run: pnpm run lint --format=github

      - name: Typecheck
        run: pnpm run typecheck

      - name: Typecheck matrix
        run: |
          pnpm --filter @permdock/types-ts59 typecheck
          pnpm --filter @permdock/types-ts6 typecheck
          pnpm --filter @permdock/types-ts7 typecheck

      - name: Test
        run: pnpm run test

      - name: Size
        run: pnpm run size

      - name: Catalog drift
        run: |
          pnpm exec permdock collect --check --cwd tests/integration/fixtures/posts
          pnpm exec permdock collect --check --cwd apps/examples/monorepo
          pnpm exec permdock collect --check --cwd tests/e2e/fixtures/turborepo

      - name: Docs drift
        run: pnpm run docs:drift

      - name: Publish checks
        run: pnpm run check:publish

  build:
    name: Production builds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          runtime: node@24
          cache: true
          require-lockfile: true

      - name: Build
        run: pnpm run build

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: packages/*/dist
          retention-days: 1
          if-no-files-found: error

  integration:
    name: Integration (Postgres)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          runtime: node@24
          cache: true
          require-lockfile: true

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: packages

      - name: Integration
        run: pnpm run test:integration

  runtimes:
    name: Runtimes (Bun, Deno, workerd)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          runtime: node@24
          cache: true
          require-lockfile: true

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: packages

      - name: Runtimes
        run: pnpm run test:runtimes

  e2e:
    name: E2E (${{ matrix.shard.name }})
    needs: build
    runs-on: ubuntu-latest
    # A shard takes about 2 minutes; the nightly run repeats every test three times.
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard:
          - name: http-examples
            projects: >-
              --project=hono --project=express --project=fastify --project=elysia
              --project=nest --project=trpc --project=orpc --project=better-auth
              --project=clerk --project=convex --project=drizzle --project=prisma
              --project=supabase-rls --project=authzen-pdp --project=scim
              --project=supabase-middleware --project=mcp-server --project=terminal
          - name: agent-examples
            projects: >-
              --project=a2a-agent --project=ai-sdk-agent --project=claude-agent
              --project=eve-agent --project=openai-agent
          - name: ui-examples
            projects: >-
              --project=react-vite --project=vue --project=svelte --project=solid
              --project=webmcp --project=expo --project=marketing
          # next build && next start, then @next/playwright instant().
          - name: next-example
            projects: --project=next
          - name: next-saas
            projects: --project=next-saas
          - name: vite-saas
            projects: >-
              --project=sveltekit-saas --project=nuxt-saas
              --project=tanstack-start-saas --project=solidstart-saas
          - name: expo-saas
            projects: --project=expo-saas
          - name: scenario-services
            projects: >-
              --project=mcp-oauth --project=ai-chat --project=realtime-collab
              --project=b2b-scim
          - name: turborepo
            projects: --project=turborepo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          runtime: node@24
          cache: true
          require-lockfile: true

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: packages

      - name: Playwright version
        id: playwright
        run: echo "version=$(pnpm --filter @permdock/e2e exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright browsers
        if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm --filter @permdock/e2e exec playwright install --with-deps chromium

      - name: Install Playwright system dependencies
        if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm --filter @permdock/e2e exec playwright install-deps chromium

      - name: E2E
        run: |
          # Word splitting turns the project list into separate flags.
          # shellcheck disable=SC2086
          pnpm --filter @permdock/e2e exec playwright test $PROJECTS $REPEAT
        env:
          PROJECTS: ${{ matrix.shard.projects }}
          REPEAT: ${{ github.event_name == 'schedule' && '--repeat-each=3' || '' }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-${{ matrix.shard.name }}
          path: tests/e2e/test-results
          retention-days: 7
