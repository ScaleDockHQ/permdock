name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true
          require-lockfile: true

      - name: Check
        run: pnpm run check

      - name: Build
        run: pnpm run build

      - name: Typecheck matrix
        run: |
          pnpm --filter @permdock/types-ts59 typecheck
          pnpm --filter @permdock/types-ts6 typecheck
          pnpm --filter @permdock/types-ts7 typecheck

      - name: Test
        run: pnpm run test

      - name: Size
        run: pnpm run size

      - name: Catalog drift
        run: |
          pnpm exec permdock collect --check --cwd tests/integration/fixtures/posts
          pnpm exec permdock collect --check --cwd apps/examples/monorepo

      - name: Publish checks
        run: pnpm run check:publish

      - name: Install Playwright
        run: pnpm --filter @permdock/e2e exec playwright install --with-deps chromium

      - name: E2E
        run: pnpm run test:e2e

      - name: Integration
        run: pnpm run test:integration
