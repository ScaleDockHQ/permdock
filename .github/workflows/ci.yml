name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # `labeled` re-runs a pull request when `ci:full` is added.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  schedule:
    - cron: "17 3 * * *"

permissions: {}

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: true
  # Runners are ephemeral: read and write only the Remote Cache. Dependabot cannot read the
  # signature key that turbo.json requires for the Remote Cache, so its runs use a local cache.
  TURBO_CACHE: ${{ github.actor == 'dependabot[bot]' && 'local:rw' || 'local:,remote:rw' }}
  TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}

jobs:
  # `full` is true on a push to main, the nightly run and a pull request labelled `ci:full`: every
  # suite runs whole, with coverage. Otherwise a pull request runs the tests its diff reaches
  # (scripts/select-tests.ts). Exit 0 from `turbo query affected` means unaffected; exit 1
  # (affected) and exit 2 (error) both run the suite.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      full: ${{ steps.affected.outputs.full }}
      integration: ${{ steps.affected.outputs.integration }}
      runtimes: ${{ steps.affected.outputs.runtimes }}
      instant: ${{ steps.affected.outputs.instant }}
      perf: ${{ steps.affected.outputs.perf }}
    steps:
      - uses: actions/checkout@v7
        with:
          # `turbo query affected` diffs against the merge base.
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - uses: $/.github/actions/setup
        with:
          cache: "false"
          install: "false"
          remote-cache: "false"

      - name: Affected suites
        id: affected
        env:
          EVENT: ${{ github.event_name }}
          FULL_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'ci:full') }}
        run: |
          version="$(sed -n 's/^  turbo: //p' pnpm-workspace.yaml)"
          if [ -z "$version" ]; then
            echo "pnpm-workspace.yaml has no turbo catalog pin"
            exit 1
          fi
          full=false
          if [ "$EVENT" != "pull_request" ] || [ "$FULL_LABEL" = "true" ]; then
            full=true
          fi
          echo "full=$full" | tee -a "$GITHUB_OUTPUT"
          affected() {
            [ "$full" = "true" ] && return 0
            for package in "$@"; do
              pnpm dlx "turbo@$version" query affected --packages "$package" --exit-code >/dev/null || return 0
            done
            return 1
          }
          report() {
            if "$@"; then echo "true"; else echo "false"; fi
          }
          echo "integration=$(report affected permdock @permdock/integration)" | tee -a "$GITHUB_OUTPUT"
          echo "perf=$(report affected permdock @permdock/integration)" | tee -a "$GITHUB_OUTPUT"
          echo "runtimes=$(report affected permdock @permdock/runtimes)" | tee -a "$GITHUB_OUTPUT"
          echo "instant=$(report affected permdock @permdock/example-next)" | tee -a "$GITHUB_OUTPUT"

  build:
    name: Production builds
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          # `--affected` diffs against the merge base.
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - uses: $/.github/actions/setup
        with:
          turbo-team: ${{ vars.TURBO_TEAM }}
          trust-lockfile: "true"

      - name: Build affected
        if: github.event_name == 'pull_request'
        run: pnpm exec turbo run build --affected

      - name: Build
        if: github.event_name != 'pull_request'
        run: pnpm exec turbo run build

  # `instant()` needs a production build compiled with the testing API, so the specs
  # build and start the example themselves (apps/examples/next/playwright.config.ts).
  instant:
    name: Instant navigation specs
    needs: changes
    if: needs.changes.outputs.instant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup
        with:
          turbo-team: ${{ vars.TURBO_TEAM }}
          trust-lockfile: "true"

      - name: Browser
        run: pnpm exec playwright install --with-deps chromium
        working-directory: apps/examples/next

      - name: Instant specs
        run: pnpm exec turbo run test:e2e --filter=@permdock/example-next

  verify:
    name: Verify
    needs: changes
    permissions:
      contents: read
      id-token: write
    uses: $/.github/workflows/verify.yml
    with:
      affected: ${{ github.event_name == 'pull_request' }}
      full: ${{ needs.changes.outputs.full == 'true' }}
    secrets:
      TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}

  # Timing gates, alone on their machine, one task at a time: the ceilings flake when
  # tasks share the CPU (decision 0063).
  perf:
    name: Perf
    needs: changes
    if: needs.changes.outputs.perf == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - uses: $/.github/actions/setup
        with:
          turbo-team: ${{ vars.TURBO_TEAM }}
          trust-lockfile: "true"

      - name: Timing gates
        run: pnpm exec turbo run typecheck:perf generate:perf runtime:perf rls-bench cli:startup --concurrency=1

      # After the timing gates, so it does not share their CPU. The whole bench takes about
      # 5 minutes, so a pull request runs it only with `ci:full`.
      - name: RLS bench
        if: needs.changes.outputs.full == 'true'
        run: pnpm --filter @permdock/integration exec vitest run --project rls-bench

  integration:
    name: Integration (Postgres ${{ matrix.shard }})
    needs: changes
    if: needs.changes.outputs.integration == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        # A pull request runs one job over the selected files; a full run uses three shards.
        shard: ${{ fromJSON(needs.changes.outputs.full == 'true' && '[1, 2, 3]' || '[1]') }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The selection diffs against the merge base.
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - uses: $/.github/actions/setup
        with:
          turbo-team: ${{ vars.TURBO_TEAM }}
          trust-lockfile: "true"

      - name: Build
        run: pnpm exec turbo run build --filter=permdock

      - name: Integration
        env:
          FULL: ${{ needs.changes.outputs.full }}
          SHARD: ${{ matrix.shard }}
        run: |
          pnpm --filter @permdock/integration exec prisma generate
          if [ "$FULL" = "true" ]; then
            pnpm --filter @permdock/integration exec vitest run --project integration --maxWorkers=2 --shard="$SHARD/3"
          else
            node scripts/select-tests.ts integration
          fi

  runtimes:
    name: Runtimes (Bun, Deno, workerd)
    needs: changes
    if: needs.changes.outputs.runtimes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup
        with:
          turbo-team: ${{ vars.TURBO_TEAM }}
          trust-lockfile: "true"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Runtimes
        run: pnpm exec turbo run test:runtimes --filter=@permdock/runtimes

  # The one required check. A skipped suite counts as passed; a skipped matrix never creates
  # job names that branch protection could require.
  gate:
    name: CI
    needs: [changes, build, instant, verify, perf, integration, runtimes]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions: {}
    steps:
      - name: Every job passed or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *)
                echo "a job finished $result"
                exit 1
                ;;
            esac
          done
