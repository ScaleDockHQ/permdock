name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: true
  # Runners are ephemeral: read and write only the Remote Cache.
  TURBO_CACHE: local:,remote:rw
  TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}

jobs:
  pr-title:
    name: PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup
        with:
          remote-cache: "false"

      # The title becomes the squash commit.
      - name: Conventional commit header
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$TITLE" | pnpm exec commitlint

  # Exit 0 from `turbo query affected` means unaffected. Exit 1 (affected) and
  # exit 2 (error) both run the suite. A push to main runs every suite.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      integration: ${{ steps.affected.outputs.integration }}
      runtimes: ${{ steps.affected.outputs.runtimes }}
      instant: ${{ steps.affected.outputs.instant }}
    steps:
      - uses: actions/checkout@v7
        with:
          # `turbo query affected` diffs against the merge base.
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - uses: $/.github/actions/setup
        with:
          install: "false"
          remote-cache: "false"

      - name: Affected suites
        id: affected
        env:
          EVENT: ${{ github.event_name }}
        run: |
          version="$(sed -n 's/^  turbo: //p' pnpm-workspace.yaml)"
          if [ -z "$version" ]; then
            echo "pnpm-workspace.yaml has no turbo catalog pin"
            exit 1
          fi
          affected() {
            [ "$EVENT" != "pull_request" ] || ! pnpm dlx "turbo@$version" query affected --packages "$1" --exit-code >/dev/null
          }
          for suite in integration runtimes; do
            if affected "@permdock/$suite"; then
              echo "$suite=true" | tee -a "$GITHUB_OUTPUT"
            else
              echo "$suite=false" | tee -a "$GITHUB_OUTPUT"
            fi
          done
          if affected "@permdock/example-next"; then
            echo "instant=true" | tee -a "$GITHUB_OUTPUT"
          else
            echo "instant=false" | tee -a "$GITHUB_OUTPUT"
          fi

  build:
    name: Production builds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup
        with:
          turbo-team: ${{ vars.TURBO_TEAM }}

      - name: Build
        run: pnpm run build

  # `instant()` needs a production build compiled with the testing API, so the specs
  # build and start the example themselves (apps/examples/next/playwright.config.ts).
  instant:
    name: Instant navigation specs
    needs: changes
    if: needs.changes.outputs.instant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup
        with:
          turbo-team: ${{ vars.TURBO_TEAM }}

      - name: Build
        run: pnpm exec turbo run build --filter=permdock

      - name: Browser
        run: pnpm exec playwright install --with-deps chromium
        working-directory: apps/examples/next

      - name: Instant specs
        run: pnpm run test:e2e
        working-directory: apps/examples/next

  verify:
    name: Verify
    permissions:
      contents: read
      id-token: write
    uses: $/.github/workflows/verify.yml
    with:
      affected: ${{ github.event_name == 'pull_request' }}
    secrets:
      TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}

  integration:
    name: Integration (Postgres ${{ matrix.shard }}/3)
    needs: changes
    if: needs.changes.outputs.integration == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup
        with:
          turbo-team: ${{ vars.TURBO_TEAM }}

      - name: Build
        run: pnpm exec turbo run build --filter=permdock

      # `rls-bench` (bench/) runs in the perf job. Two workers on those files
      # made shard 1 slower (240s against 163s on one worker).
      - name: Integration
        run: >-
          pnpm --filter @permdock/integration exec prisma generate &&
          pnpm --filter @permdock/integration exec vitest run
          --project integration --maxWorkers=2 --shard=${{ matrix.shard }}/3

  # The peer floor and the catalog pin (0.53.0); the range has no upper bound
  # (tests/package/better-supabase-peer-range.test.ts).
  better-supabase:
    name: better-supabase ${{ matrix.better-supabase }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        better-supabase: ["0.53.0"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The unit suite and the integration shards already run the catalog pin.
      - name: Catalog pin
        id: pin
        env:
          VERSION: ${{ matrix.better-supabase }}
        run: |
          pin="$(sed -n 's/^  better-supabase: \([0-9.]*\)$/\1/p' pnpm-workspace.yaml)"
          if [ "$VERSION" = "$pin" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "better-supabase $VERSION is the catalog pin; the other suites already run it"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: $/.github/actions/setup
        if: steps.pin.outputs.skip != 'true'
        with:
          turbo-team: ${{ vars.TURBO_TEAM }}
          # This step rewrites the catalog pin, so its store must not be saved.
          save-cache: "false"

      - name: Install better-supabase ${{ matrix.better-supabase }}
        if: steps.pin.outputs.skip != 'true'
        env:
          VERSION: ${{ matrix.better-supabase }}
        run: |
          sed -i -E "s/^  better-supabase: [0-9.]+$/  better-supabase: $VERSION/" pnpm-workspace.yaml
          pnpm install --no-frozen-lockfile
          node -p "require('./packages/permdock/node_modules/better-supabase/package.json').version" | grep -qx "$VERSION"

      - name: Build
        if: steps.pin.outputs.skip != 'true'
        run: pnpm exec turbo run build --filter=permdock

      - name: Provider tests
        if: steps.pin.outputs.skip != 'true'
        run: pnpm exec vitest run tests/better-supabase
        working-directory: packages/permdock

      - name: Provider integration
        if: steps.pin.outputs.skip != 'true'
        run: pnpm exec vitest run --project integration src/better-supabase-
        working-directory: tests/integration

  runtimes:
    name: Runtimes (Bun, Deno, workerd)
    needs: changes
    if: needs.changes.outputs.runtimes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup
        with:
          turbo-team: ${{ vars.TURBO_TEAM }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Build
        run: pnpm exec turbo run build --filter=permdock

      - name: Runtimes
        run: pnpm run test:runtimes

  # A skipped matrix never creates "Integration (Postgres 1/3)", so branch
  # protection cannot require those names. This job always reports.
  heavy-suites:
    name: Heavy suites
    needs: [changes, integration, runtimes]
    if: always() && needs.changes.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Shards and runtimes
        env:
          INTEGRATION: ${{ needs.integration.result }}
          RUNTIMES: ${{ needs.runtimes.result }}
        run: |
          for result in "$INTEGRATION" "$RUNTIMES"; do
            case "$result" in
              success|skipped) ;;
              *)
                echo "a heavy suite finished $result"
                exit 1
                ;;
            esac
          done
