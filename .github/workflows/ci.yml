name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: true
  TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}

jobs:
  pr-title:
    name: PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup

      # The title becomes the squash commit.
      - name: Conventional commit header
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$TITLE" | pnpm exec commitlint

  # Fills the Remote Cache first, so every later job restores the builds instead of repeating them.
  build:
    name: Production builds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    outputs:
      integration: ${{ steps.affected.outputs.integration }}
      runtimes: ${{ steps.affected.outputs.runtimes }}
    steps:
      - uses: actions/checkout@v7
        with:
          # `turbo query affected` diffs against the merge base.
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - uses: $/.github/actions/setup
        with:
          turbo-team: ${{ vars.TURBO_TEAM }}

      - name: Build
        run: pnpm run build

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: packages/*/dist
          retention-days: 1
          if-no-files-found: error

      # Exit 0 means unaffected; 1 (affected) and 2 (error) both run the suite. Pushes to main run everything.
      - name: Affected suites
        id: affected
        env:
          EVENT: ${{ github.event_name }}
        run: |
          for suite in integration runtimes; do
            run=true
            if [ "$EVENT" = pull_request ] && pnpm exec turbo query affected --packages "@permdock/$suite" --exit-code >/dev/null; then
              run=false
            fi
            echo "$suite=$run" | tee -a "$GITHUB_OUTPUT"
          done

  verify:
    name: Verify
    needs: build
    permissions:
      contents: read
      id-token: write
    uses: $/.github/workflows/verify.yml
    with:
      affected: ${{ github.event_name == 'pull_request' }}
    secrets:
      TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}

  integration:
    name: Integration (Postgres ${{ matrix.shard }}/3)
    needs: build
    if: needs.build.outputs.integration == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup
        with:
          turbo-team: ${{ vars.TURBO_TEAM }}

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: packages

      - name: Integration
        run: pnpm run test:integration --shard=${{ matrix.shard }}/3

  # The peer floor (0.13.0) and the catalog pin; the range has no upper bound
  # (tests/package/better-supabase-peer-range.test.ts).
  better-supabase:
    name: better-supabase ${{ matrix.better-supabase }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        better-supabase: ["0.13.0", "0.18.0"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup
        with:
          turbo-team: ${{ vars.TURBO_TEAM }}

      - name: Install better-supabase ${{ matrix.better-supabase }}
        env:
          VERSION: ${{ matrix.better-supabase }}
        run: |
          sed -i -E "s/^  better-supabase: [0-9.]+$/  better-supabase: $VERSION/" pnpm-workspace.yaml
          pnpm install --no-frozen-lockfile
          node -p "require('./packages/permdock/node_modules/better-supabase/package.json').version" | grep -qx "$VERSION"

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: packages

      - name: Provider tests
        run: pnpm exec vitest run tests/better-supabase
        working-directory: packages/permdock

      - name: Provider integration
        run: pnpm exec vitest run --project integration src/better-supabase-
        working-directory: tests/integration

  runtimes:
    name: Runtimes (Bun, Deno, workerd)
    needs: build
    if: needs.build.outputs.runtimes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup
        with:
          turbo-team: ${{ vars.TURBO_TEAM }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: packages

      - name: Runtimes
        run: pnpm run test:runtimes
