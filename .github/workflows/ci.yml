name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Nightly flake hunt: every e2e test three times, no retries.
    - cron: '17 3 * * *'

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: true
  TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}

jobs:
  verify:
    name: Verify
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/verify.yml
    with:
      affected: ${{ github.event_name == 'pull_request' }}
    secrets:
      TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}

  build:
    name: Production builds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          turbo-team: ${{ vars.TURBO_TEAM }}

      - name: Build
        run: pnpm run build

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: packages/*/dist
          retention-days: 1
          if-no-files-found: error

  integration:
    name: Integration (Postgres)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          turbo-team: ${{ vars.TURBO_TEAM }}

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: packages

      - name: Integration
        run: pnpm run test:integration

  runtimes:
    name: Runtimes (Bun, Deno, workerd)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          turbo-team: ${{ vars.TURBO_TEAM }}

      - uses: oven-sh/setup-bun@v2

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: packages

      - name: Runtimes
        run: pnpm run test:runtimes

  e2e:
    name: E2E (${{ matrix.shard.name }})
    needs: build
    runs-on: ubuntu-latest
    # A shard takes about 2 minutes; the nightly run repeats every test three times.
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        shard:
          - name: http-examples
            projects: >-
              --project=hono --project=express --project=fastify --project=elysia
              --project=nest --project=trpc --project=orpc --project=better-auth
              --project=clerk --project=convex --project=drizzle --project=prisma
              --project=supabase-rls --project=authzen-pdp --project=scim
              --project=supabase-middleware --project=mcp-server --project=terminal
          - name: agent-examples
            projects: >-
              --project=a2a-agent --project=ai-sdk-agent --project=claude-agent
              --project=eve-agent --project=openai-agent
          - name: ui-examples
            projects: >-
              --project=react-vite --project=vue --project=svelte --project=solid
              --project=webmcp --project=expo --project=marketing
              --project=marketing-mobile --project=docs --project=docs-mobile
          # next build && next start, then @next/playwright instant().
          - name: next-example
            projects: --project=next
          - name: next-saas
            projects: --project=next-saas
          - name: vite-saas
            projects: >-
              --project=sveltekit-saas --project=nuxt-saas
              --project=tanstack-start-saas --project=solidstart-saas
          - name: expo-saas
            projects: --project=expo-saas
          - name: scenario-services
            projects: >-
              --project=mcp-oauth --project=ai-chat --project=realtime-collab
              --project=b2b-scim
          - name: turborepo
            projects: --project=turborepo
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          turbo-team: ${{ vars.TURBO_TEAM }}

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: packages

      - name: Playwright version
        id: playwright
        run: echo "version=$(pnpm --filter @permdock/e2e exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright browsers
        if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm --filter @permdock/e2e exec playwright install --with-deps chromium

      - name: Install Playwright system dependencies
        if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm --filter @permdock/e2e exec playwright install-deps chromium

      - name: E2E
        run: |
          # Word splitting turns the project list into separate flags.
          # shellcheck disable=SC2086
          pnpm --filter @permdock/e2e exec playwright test $PROJECTS $REPEAT
        env:
          PROJECTS: ${{ matrix.shard.projects }}
          REPEAT: ${{ github.event_name == 'schedule' && '--repeat-each=3' || '' }}

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-${{ matrix.shard.name }}
          path: tests/e2e/test-results
          retention-days: 7
