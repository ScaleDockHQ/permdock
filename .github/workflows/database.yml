name: Database

on:
  push:
    branches: [main]
    paths:
      - apps/examples/next-better-supabase/**
      - packages/permdock/src/cli/**
      - packages/permdock/src/supabase/**
      - packages/permdock/src/better-supabase/**
      - .github/workflows/database.yml
  pull_request:
    branches: [main]
    paths:
      - apps/examples/next-better-supabase/**
      - packages/permdock/src/cli/**
      - packages/permdock/src/supabase/**
      - packages/permdock/src/better-supabase/**
      - .github/workflows/database.yml

permissions: {}

concurrency:
  group: database-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: true
  TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}

jobs:
  supabase:
    name: Supabase stack (next-better-supabase, better-supabase ${{ matrix.better-supabase }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      # The lowest and the latest better-supabase the peer range accepts; the last
      # entry is the catalog pin the committed SQL is generated from.
      matrix:
        better-supabase: ["0.9.0", "0.10.0"]
    env:
      CATALOG: ${{ matrix.better-supabase == '0.10.0' }}
    defaults:
      run:
        working-directory: apps/examples/next-better-supabase
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup
        with:
          turbo-team: ${{ vars.TURBO_TEAM }}

      - name: Install better-supabase ${{ matrix.better-supabase }}
        if: env.CATALOG != 'true'
        working-directory: .
        env:
          VERSION: ${{ matrix.better-supabase }}
        run: |
          sed -i -E "s/^  better-supabase: [0-9.]+$/  better-supabase: $VERSION/" pnpm-workspace.yaml
          pnpm install --no-frozen-lockfile
          node -p "require('./apps/examples/next-better-supabase/node_modules/better-supabase/package.json').version" | grep -qx "$VERSION"

      # The committed SQL comes from the catalog pin; an older better-supabase writes
      # its own schemas and migrations before the stack applies them.
      - name: Regenerate the better-supabase SQL
        if: env.CATALOG != 'true'
        run: |
          pnpm --filter permdock build
          pnpm exec better-supabase sql sync
          pnpm exec better-supabase sql upgrade

      # Native runtime; Postgres comes up while permdock builds.
      - name: Start the local stack
        id: stack
        background: true
        run: pnpm run supabase:start

      - name: Build permdock
        if: env.CATALOG == 'true'
        run: pnpm --filter permdock build
        working-directory: .

      - name: Generated SQL, manifest, blocks and types are current
        if: env.CATALOG == 'true'
        run: pnpm run gen:check

      - wait: stack

      # pg-delta replays the migrations, then diffs them against supabase/schemas;
      # --strict-coverage fails on an object pg-delta cannot manage.
      - name: Declarative schemas match the migrations
        if: env.CATALOG == 'true'
        run: |
          pnpm run supabase:diff drift_check --strict-coverage 2>&1 | tee sync.log
          grep -q 'No schema changes found' sync.log
          test -z "$(git status --porcelain -- supabase/migrations)"

      # db lint, db advisors and both doctors; before pgTAP, whose test helpers stay installed.
      - name: Lint, advisors and doctors
        run: pnpm run supabase:check

      - name: pgTAP
        run: pnpm run supabase:test

      - name: Stop the local stack
        if: always()
        run: pnpm run supabase:stop
