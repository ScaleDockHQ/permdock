name: Verify

on:
  workflow_call:
    inputs:
      affected:
        description: Run Turborepo tasks only for workspaces changed against the base branch.
        type: boolean
        default: false
      full:
        description: Run the whole unit suite with coverage; otherwise run the test files the diff reaches.
        type: boolean
        default: true
    secrets:
      TURBO_REMOTE_CACHE_SIGNATURE_KEY:
        required: false

permissions: {}

env:
  CI: true
  # Runners are ephemeral: read and write only the Remote Cache. Dependabot cannot read the
  # signature key that turbo.json requires for the Remote Cache, so its runs use a local cache.
  TURBO_CACHE: ${{ github.actor == 'dependabot[bot]' && 'local:rw' || 'local:,remote:rw' }}
  TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}
  AFFECTED: ${{ inputs.affected && '--affected' || '' }}

jobs:
  # One machine and one install for every cheap gate; Turbo runs the workspace tasks concurrently.
  static:
    name: static
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          # `--affected` diffs against the merge base.
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - uses: $/.github/actions/setup
        with:
          turbo-team: ${{ vars.TURBO_TEAM }}
          # The only writer. Every other job restores this entry.
          save-cache: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

      # The title becomes the squash commit.
      - name: PR title
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$TITLE" | pnpm exec commitlint

      - parallel:
          # Includes the public types under TypeScript 5.9, 6 (typecheck:compat) and 7 (tests/types).
          - name: Workspace tasks
            run: >-
              pnpm exec turbo run lint typecheck typecheck:compat typecheck:tooling knip docs:drift openapi:check
              gen:check doctor size check:publish audit:high $AFFECTED
          - name: Format
            run: pnpm run format:check
          - name: Root lint
            run: pnpm run lint:root
          - name: Boundaries
            run: pnpm run boundaries

  # Includes the Nest adapter against Nest 11, the lowest peer version (tests/nest-11).
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - uses: $/.github/actions/setup
        with:
          turbo-team: ${{ vars.TURBO_TEAM }}

      # Full runs measure coverage (the 90% floor in packages/permdock/vitest.config.ts).
      - name: Full suite
        if: inputs.full
        env:
          COVERAGE: "true"
        run: pnpm exec turbo run test

      # The library's own tests are selected from the diff; other workspaces use Turbo's affected set.
      - name: Selected tests
        if: ${{ !inputs.full }}
        run: |
          pnpm exec turbo run test --affected --filter='!permdock'
          node scripts/select-tests.ts unit
