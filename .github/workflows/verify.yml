name: Verify

on:
  workflow_call:
    inputs:
      affected:
        description: Run Turborepo tasks only for workspaces changed against the base branch.
        type: boolean
        default: false
    secrets:
      TURBO_REMOTE_CACHE_SIGNATURE_KEY:
        required: false

permissions: {}

env:
  CI: true
  TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}
  AFFECTED: ${{ inputs.affected && '--affected' || '' }}
  # The Next.js workspaces; GitHub-hosted runners run out of memory building them in parallel.
  NEXT_APPS: >-
    --filter=docs --filter=marketing --filter=@permdock/example-next
    --filter=@permdock/example-next-better-supabase
    --filter=@permdock/e2e-next-saas --filter=@permdock/e2e-turbo-web

jobs:
  verify:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: format
            run: pnpm run format:check
          - name: lint
            next: true
            run: pnpm run lint:root && pnpm exec turbo run lint $AFFECTED
          - name: knip
            run: pnpm exec turbo run knip
          # Includes the public types under TypeScript 5.9, 6 and 7 (tests/types).
          - name: typecheck
            next: true
            run: pnpm exec turbo run typecheck typecheck:tooling typecheck:perf $AFFECTED
          - name: test
            next: true
            run: pnpm run authzen:vectors && pnpm exec turbo run test $AFFECTED
          - name: boundaries
            run: pnpm run boundaries
          - name: audit
            run: pnpm exec turbo run audit:high
          - name: drift
            next: true
            run: pnpm exec turbo run docs:drift openapi:check gen:check $AFFECTED
          - name: doctor
            run: pnpm exec turbo run doctor $AFFECTED
          - name: size
            run: pnpm exec turbo run size $AFFECTED
          - name: publish
            run: pnpm exec turbo run check:publish $AFFECTED
    steps:
      - uses: actions/checkout@v7
        with:
          # `--affected` diffs against the merge base.
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          turbo-team: ${{ vars.TURBO_TEAM }}

      # Turbopack's build cache; Turborepo restores the outputs, not `.next/cache`.
      - uses: actions/cache@v6
        if: matrix.next
        with:
          path: |
            apps/*/.next/cache
            apps/examples/*/.next/cache
            tests/e2e/fixtures/*/.next/cache
            tests/e2e/fixtures/turborepo/apps/*/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/**/*.ts', 'apps/**/*.tsx', 'apps/**/*.mdx', 'apps/**/*.css', 'tests/e2e/fixtures/**/*.tsx', '!**/node_modules/**') }}
          restore-keys: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Build Next.js apps
        if: matrix.next
        run: |
          # Word splitting turns NEXT_APPS into separate flags.
          # shellcheck disable=SC2086
          pnpm exec turbo run build $NEXT_APPS --concurrency=1

      - name: ${{ matrix.name }}
        run: ${{ matrix.run }}
