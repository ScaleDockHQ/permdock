name: Verify

on:
  workflow_call:
    inputs:
      affected:
        description: Run Turborepo tasks only for workspaces changed against the base branch.
        type: boolean
        default: false
    secrets:
      TURBO_REMOTE_CACHE_SIGNATURE_KEY:
        required: false

permissions: {}

env:
  CI: true
  # Runners are ephemeral: read and write only the Remote Cache.
  TURBO_CACHE: local:,remote:rw
  TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}
  AFFECTED: ${{ inputs.affected && '--affected' || '' }}

jobs:
  # One machine and one install for every cheap gate; Turbo runs the workspace tasks concurrently.
  static:
    name: static
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          # `--affected` diffs against the merge base.
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - uses: $/.github/actions/setup
        with:
          turbo-team: ${{ vars.TURBO_TEAM }}
          # The only writer. Every other job restores this entry.
          save-cache: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

      - parallel:
          # Includes the public types under TypeScript 5.9, 6 (typecheck:compat) and 7 (tests/types).
          - name: Workspace tasks
            run: >-
              pnpm exec turbo run lint typecheck typecheck:compat typecheck:tooling knip docs:drift openapi:check
              gen:check doctor size check:publish audit:high $AFFECTED
          - name: Format
            run: pnpm run format:check
          - name: Root lint
            run: pnpm run lint:root
          - name: Boundaries
            run: pnpm run boundaries

  heavy:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Includes the Nest adapter against Nest 11, the lowest peer version (tests/nest-11).
          - name: test
            run: pnpm exec turbo run test $AFFECTED
          # Alone on its machine, one task at a time: the timing ceilings flake when tasks share the CPU.
          - name: perf
            run: pnpm exec turbo run typecheck:perf generate:perf runtime:perf rls-bench cli:startup --concurrency=1
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - uses: $/.github/actions/setup
        with:
          turbo-team: ${{ vars.TURBO_TEAM }}

      - name: ${{ matrix.name }}
        run: ${{ matrix.run }}

      # After the timing gates, so it does not share their CPU. The integration
      # shards exclude this project: custom-roles-4m alone held a shard.
      - name: RLS bench
        if: matrix.name == 'perf'
        run: pnpm --filter @permdock/integration exec vitest run --project rls-bench
