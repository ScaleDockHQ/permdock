name: Release

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# No pnpm store cache and no Turborepo remote cache here: a publishing job builds from a cold start.
jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      # changesets/action pushes the version commit and release tags through the GitHub API.
      contents: write
      pull-requests: write
      # npm trusted publishing: the registry exchanges the job's OIDC token, so
      # the workflow holds no npm token. The trusted publisher is `release.yml`.
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          cache: 'false'

      # The pnpm runtime ships Node without npm; the Node.js distribution bundles it.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      # Trusted publishing needs npm 11.5.1 or later.
      - name: npm
        run: |
          version="$(npm --version)"
          echo "npm $version"
          node -e "const [a,b,c]=process.argv[1].split('.').map(Number);process.exit(a>11||(a===11&&(b>5||(b===5&&c>=1)))?0:1)" "$version"

      - name: Build
        run: pnpm run build

      - name: Verify
        run: pnpm run verify

      - name: Create release pull request or publish
        id: changesets
        uses: changesets/action@v2.1.2
        with:
          # Publishing to npm is opt-in: set the repository variable NPM_PUBLISH to 'true'.
          version-script: pnpm run version-packages
          publish-script: ${{ vars.NPM_PUBLISH == 'true' && 'pnpm run release' || '' }}
          pr-title: 'chore: version packages'
          commit-message: 'chore: version packages'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge main back into develop
        if: steps.changesets.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          if gh api "repos/$REPO/branches/develop" --silent 2>/dev/null; then
            gh api "repos/$REPO/merges" -f base=develop -f head=main -f commit_message='chore: merge main into develop'
          fi
