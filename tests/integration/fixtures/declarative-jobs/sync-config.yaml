# Generated by permdock powersync generate from the policy. Do not edit.
# Tables outside public must be in the powersync publication:
# alter publication powersync add table better_supabase.membership_roles, better_supabase.memberships, permdock.custom_role_includes, permdock.custom_role_permissions;
# Streams that read token claims keep the claims a connection started with:
# refresh the session and reconnect PowerSync after a role or tenant change.
# https://permdock.com/docs/adapters/react-native#role-and-tenant-changes
#   jobs reads team_ids
config:
  edition: 3

streams:
  jobs:
    auto_subscribe: true
    queries:
      - 'SELECT * FROM jobs WHERE jobs.organization_id IN (SELECT memberships.organization_id FROM "better_supabase"."memberships" AS memberships INNER JOIN "better_supabase"."membership_roles" AS membership_roles ON membership_roles.organization_id = memberships.organization_id AND membership_roles.user_id = memberships.user_id WHERE memberships.user_id = auth.user_id() AND memberships.disabled_at IS NULL AND membership_roles.role = ''member'')'
      - 'SELECT * FROM jobs WHERE jobs.organization_id IN (SELECT memberships.organization_id FROM "better_supabase"."memberships" AS memberships INNER JOIN "better_supabase"."membership_roles" AS membership_roles ON membership_roles.organization_id = memberships.organization_id AND membership_roles.user_id = memberships.user_id INNER JOIN "permdock"."custom_role_permissions" AS cr ON cr.role = membership_roles.role WHERE memberships.user_id = auth.user_id() AND memberships.disabled_at IS NULL AND cr.tenant_id = memberships.organization_id AND cr.scope = ''tenant'' AND cr.permission = ''jobs.read'' AND cr.effect = ''allow'' AND cr.level IS NULL)'
      - 'SELECT * FROM jobs WHERE jobs.organization_id IN (SELECT memberships.organization_id FROM "better_supabase"."memberships" AS memberships INNER JOIN "better_supabase"."membership_roles" AS membership_roles ON membership_roles.organization_id = memberships.organization_id AND membership_roles.user_id = memberships.user_id INNER JOIN "permdock"."custom_role_permissions" AS cr ON cr.role = membership_roles.role WHERE memberships.user_id = auth.user_id() AND memberships.disabled_at IS NULL AND cr.tenant_id = memberships.organization_id AND cr.scope = ''tenant'' AND cr.permission = ''jobs.read'' AND cr.effect = ''allow'' AND cr.level = ''own'') AND jobs.owner_id = auth.user_id()'
      - 'SELECT * FROM jobs WHERE jobs.organization_id IN (SELECT memberships.organization_id FROM "better_supabase"."memberships" AS memberships INNER JOIN "better_supabase"."membership_roles" AS membership_roles ON membership_roles.organization_id = memberships.organization_id AND membership_roles.user_id = memberships.user_id INNER JOIN "permdock"."custom_role_permissions" AS cr ON cr.role = membership_roles.role WHERE memberships.user_id = auth.user_id() AND memberships.disabled_at IS NULL AND cr.tenant_id = memberships.organization_id AND cr.scope = ''tenant'' AND cr.permission = ''jobs.read'' AND cr.effect = ''allow'' AND cr.level = ''team'') AND jobs.owner_id = auth.user_id()'
      - 'SELECT * FROM jobs WHERE jobs.organization_id IN (SELECT memberships.organization_id FROM "better_supabase"."memberships" AS memberships INNER JOIN "better_supabase"."membership_roles" AS membership_roles ON membership_roles.organization_id = memberships.organization_id AND membership_roles.user_id = memberships.user_id INNER JOIN "permdock"."custom_role_permissions" AS cr ON cr.role = membership_roles.role WHERE memberships.user_id = auth.user_id() AND memberships.disabled_at IS NULL AND cr.tenant_id = memberships.organization_id AND cr.scope = ''tenant'' AND cr.permission = ''jobs.read'' AND cr.effect = ''allow'' AND cr.level = ''team'') AND jobs.team_id IN (SELECT value FROM json_each(auth.parameter(''team_ids'')))'
      - 'SELECT * FROM jobs WHERE jobs.organization_id IN (SELECT memberships.organization_id FROM "better_supabase"."memberships" AS memberships INNER JOIN "better_supabase"."membership_roles" AS membership_roles ON membership_roles.organization_id = memberships.organization_id AND membership_roles.user_id = memberships.user_id INNER JOIN "permdock"."custom_role_permissions" AS cr ON cr.role = membership_roles.role WHERE memberships.user_id = auth.user_id() AND memberships.disabled_at IS NULL AND cr.tenant_id = memberships.organization_id AND cr.scope = ''tenant'' AND cr.permission = ''jobs.read'' AND cr.effect = ''allow'' AND cr.level = ''all'')'
  permdock_memberships:
    auto_subscribe: true
    queries:
      - 'SELECT * FROM "better_supabase"."memberships" AS memberships WHERE memberships.user_id = auth.user_id() AND memberships.disabled_at IS NULL'
  permdock_membership_roles:
    auto_subscribe: true
    queries:
      - 'SELECT membership_roles.organization_id, membership_roles.user_id, membership_roles.role, membership_roles.organization_id || '':'' || membership_roles.user_id || '':'' || membership_roles.role AS id FROM "better_supabase"."membership_roles" AS membership_roles WHERE membership_roles.organization_id IN (SELECT memberships.organization_id FROM "better_supabase"."memberships" AS memberships WHERE memberships.user_id = auth.user_id() AND memberships.disabled_at IS NULL) AND EXISTS (SELECT 1 FROM "better_supabase"."memberships" AS memberships WHERE memberships.organization_id = membership_roles.organization_id AND memberships.user_id = membership_roles.user_id AND memberships.disabled_at IS NULL)'
  permdock_platform_user_roles:
    auto_subscribe: true
    queries:
      - "SELECT * FROM platform_user_roles WHERE platform_user_roles.user_id = auth.user_id()"
  permdock_custom_role_permissions:
    auto_subscribe: true
    queries:
      - 'SELECT * FROM "permdock"."custom_role_permissions" AS custom_role_permissions WHERE custom_role_permissions.tenant_id IS NULL'
      - 'SELECT * FROM "permdock"."custom_role_permissions" AS custom_role_permissions WHERE custom_role_permissions.tenant_id IN (SELECT memberships.organization_id FROM "better_supabase"."memberships" AS memberships WHERE memberships.user_id = auth.user_id() AND memberships.disabled_at IS NULL)'
  permdock_custom_role_includes:
    auto_subscribe: true
    queries:
      - 'SELECT * FROM "permdock"."custom_role_includes" AS custom_role_includes WHERE custom_role_includes.tenant_id IS NULL'
      - 'SELECT * FROM "permdock"."custom_role_includes" AS custom_role_includes WHERE custom_role_includes.tenant_id IN (SELECT memberships.organization_id FROM "better_supabase"."memberships" AS memberships WHERE memberships.user_id = auth.user_id() AND memberships.disabled_at IS NULL)'
